[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-plugin-lab"
version = "0.1.0"
description = "A small, tested foundation for GPT-powered applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["black>=24.0"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.setuptools.packages.find]
include = ["gpt_plugin*"]

[tool.setuptools.package-data]
gpt_plugin = ["py.typed"]
